<svg width="600" height="380" viewBox="0 0 600 380" xmlns="http://www.w3.org/2000/svg">
  <!-- Card Background -->
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3314"/>
      <stop offset="100%" stop-color="#12200C"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C2E812"/>
      <stop offset="100%" stop-color="#8DB600"/>
    </linearGradient>
    <pattern id="cardPattern" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#FFFFFF" fill-opacity="0.04"/>
    </pattern>
  </defs>

  <rect width="600" height="380" rx="24" fill="url(#cardGrad)" stroke="#C2E812" stroke-width="2" stroke-opacity="0.3"/>
  <rect width="600" height="380" rx="24" fill="url(#cardPattern)"/>

  <!-- Top Accent Banner -->
  <rect x="0" y="0" width="600" height="12" rx="6" fill="url(#headerGrad)"/>

  <!-- Header Text -->
  <text x="36" y="48" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#C2E812" letter-spacing="2">REPUBLIC OF THE PHILIPPINES</text>
  <text x="36" y="68" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">NATIONAL IDENTIFICATION CARD</text>

  <!-- Chip Emblem -->
  <rect x="36" y="96" width="56" height="42" rx="8" fill="#E8CEA0" stroke="#B89B68" stroke-width="1.5"/>
  <line x1="36" y1="117" x2="92" y2="117" stroke="#B89B68" stroke-width="1.5"/>
  <line x1="64" y1="96" x2="64" y2="138" stroke="#B89B68" stroke-width="1.5"/>

  <!-- Photo Box -->
  <rect x="36" y="160" width="130" height="160" rx="14" fill="#243818" stroke="#DDDDB8" stroke-width="2" stroke-opacity="0.5"/>
  <!-- Avatar Silhouette -->
  <circle cx="101" cy="220" r="32" fill="#C2E812" fill-opacity="0.7"/>
  <path d="M 60 295 Q 101 245 142 295 Z" fill="#C2E812" fill-opacity="0.7"/>
  <text x="101" y="312" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#FFFFFF" text-anchor="middle">VERIFIED</text>

  <!-- Booker Details -->
  <g transform="translate(195, 120)">
    <text x="0" y="0" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#C2E812" letter-spacing="1">FULL NAME / PANGALAN</text>
    <text x="0" y="24" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF">Jhon Leovil</text>

    <text x="0" y="64" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#C2E812" letter-spacing="1">CONTACT MOBILE</text>
    <text x="0" y="84" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#F5F1DE">09123456789</text>

    <text x="0" y="120" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#C2E812" letter-spacing="1">PHILHEALTH / ID NUMBER</text>
    <text x="0" y="140" font-family="monospace" font-size="15" font-weight="bold" fill="#F5F1DE" letter-spacing="2">4892 - 1092 - 7812</text>

    <text x="0" y="174" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#C2E812" letter-spacing="1">BOOKING REF</text>
    <text x="0" y="194" font-family="monospace" font-size="13" font-weight="bold" fill="#C2E812">PB-20260917-15903</text>
  </g>

  <!-- Verified Watermark Badge -->
  <g transform="translate(480, 260)">
    <circle cx="40" cy="40" r="36" fill="none" stroke="#C2E812" stroke-width="2" stroke-dasharray="4,2"/>
    <text x="40" y="36" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#C2E812" text-anchor="middle">OFFICIAL</text>
    <text x="40" y="48" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#FFFFFF" text-anchor="middle">VALID ID</text>
  </g>
</svg>
